<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinWise | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">


    <div class="auth-box">


        <h2>Welcome Back</h2>


        <form id="loginForm">


            <input 
                type="email" 
                id="loginEmail" 
                placeholder="Email Address"
                required
            >


            <input 
                type="password" 
                id="loginPassword" 
                placeholder="Password"
                required
            >


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

            </div>


            <button type="submit">
                Login
            </button>


        </form>


        <p>
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>


        <a href="#" class="forgot">
            Forgot Password?
        </a>


    </div>


</div>


<script src="script.js"></script>


</body>

</html>
